<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>窦唯 · 专辑档案</title>
<style>
 :root {
   --bg: #090909;
   --surface: #111111;
   --surface2: #181614;
   --surface3: #1e1a15;
   --border: rgba(176,147,110,0.10);
   --border-strong: rgba(176,147,110,0.22);
   --text: #e3ddd4;
   --text-soft: #c4b8a8;
   --text-mid: #97897b;
   --text-dim: #6c6258;
   --accent: #b08c63;
   --accent-light: #d0b089;
   --accent-dark: #7a5e3a;
   --tag-bg: rgba(177,140,99,0.06);
   --shadow: 0 16px 48px rgba(0,0,0,0.4);
   --shadow-soft: 0 6px 24px rgba(0,0,0,0.28);
 }

 * { box-sizing: border-box; margin: 0; padding: 0; }

 html { scroll-behavior: smooth; }

 body {
   background: var(--bg);
   color: var(--text);
   font-family: 'Noto Serif SC', 'Source Han Serif SC', 'STSong', serif;
   min-height: 100vh;
   line-height: 1.68;
 }

 body.modal-open { overflow: hidden; }

 ::-webkit-scrollbar { width: 5px; }
 ::-webkit-scrollbar-track { background: var(--bg); }
 ::-webkit-scrollbar-thumb { background: rgba(176,147,110,0.14); border-radius: 99px; }

 /* ── Header ── */
 header {
   position: sticky;
   top: 0;
   z-index: 100;
   background: rgba(9,9,9,0.82);
   backdrop-filter: blur(20px);
   border-bottom: 1px solid var(--border);
   padding: 0 3rem;
 }

 .header-inner {
   max-width: 1440px;
   margin: 0 auto;
   display: flex;
   align-items: center;
   justify-content: space-between;
   height: 68px;
   gap: 2rem;
 }

.logo {
  display: flex;
  flex-direction: column;
  gap: 0.18rem;
}

.logo-home {
  display: inline-block;
  font-size: 1.1rem;
  color: var(--text-dim);
  text-decoration: none;
  transition: color 0.15s ease;
  margin-bottom: 0.15rem;
}

.logo-home:hover { color: var(--accent-light); }

 .logo-name {
   font-size: 1.78rem;
   font-weight: 400;
   color: var(--accent-light);
   letter-spacing: 0.2em;
   line-height: 1;
 }

 .logo-sub {
   font-size: 0.72rem;
   color: var(--text-soft);
   letter-spacing: 0.14em;
 }

 .nav-tabs {
   display: flex;
   gap: 0;
   border: 1px solid var(--border-strong);
   border-radius: 999px;
   overflow: hidden;
   background: rgba(17,16,14,0.72);
 }

 .nav-tab {
   padding: 0.5rem 1.25rem;
   font-size: 0.78rem;
   letter-spacing: 0.08em;
   background: transparent;
   color: var(--text-dim);
   border: none;
   cursor: pointer;
   transition: all 0.2s ease;
   font-family: inherit;
   white-space: nowrap;
 }

 .nav-tab:not(:last-child) { border-right: 1px solid var(--border-strong); }

 .nav-tab.active {
   background: rgba(176,140,99,0.18);
   color: var(--accent-light);
   box-shadow: inset 0 0 0 1px rgba(176,140,99,0.15);
 }

 .nav-tab:hover:not(.active) {
   color: var(--text);
   background: rgba(255,255,255,0.02);
 }

 /* ── Shared layout ── */
 .hero-shell,
 .stats-bar,
 .filter-bar,
 .main,
 .page-footer {
   max-width: 1440px;
   margin: 0 auto;
   padding-left: 3rem;
   padding-right: 3rem;
 }

/* ── Hero ── */
.hero-shell {
  padding-top: 2rem;
  padding-bottom: 0.75rem;
}

.hero {
  position: relative;
  padding: 1.6rem 0 1.2rem;
  border-bottom: 1px solid var(--border);
}

 .hero::before {
   content: '';
   position: absolute;
   bottom: -1px;
   left: 0;
   right: 0;
   height: 1px;
   background: linear-gradient(to right, transparent, rgba(176,147,110,0.18), transparent);
 }

 .hero-title {
   font-size: clamp(2rem, 4.5vw, 3.5rem);
   font-weight: 400;
   line-height: 1.15;
   letter-spacing: 0.1em;
   color: var(--text);
   margin-bottom: 0.85rem;
 }

 .hero-copy {
   font-size: 0.94rem;
   color: var(--text-soft);
   line-height: 1.95;
   max-width: 640px;
   margin-bottom: 0.5rem;
 }

 .hero-note {
   font-size: 0.72rem;
   color: var(--text-dim);
   letter-spacing: 0.06em;
 }

/* ── Index Bar (merged sticky container) ── */
.index-bar {
  position: sticky;
  top: 68px;
  z-index: 70;
  border-bottom: 1px solid var(--border);
  background: rgba(9,9,9,0.80);
  backdrop-filter: blur(16px);
}

.index-bar .stats-bar {
  border-bottom: none;
}

.index-bar .filter-bar {
  position: static;
  top: auto;
  border-bottom: none;
  background: transparent;
  backdrop-filter: none;
}

/* ── Stats Bar ── */
.stats-bar {
  padding-top: 0.7rem;
  padding-bottom: 0.7rem;
  display: flex;
  align-items: center;
  gap: 0;
  border-bottom: 1px solid var(--border);
}

 .stats-item {
   display: inline-flex;
   align-items: center;
   gap: 0.5rem;
 }

 .stats-label {
   color: var(--text-dim);
   text-transform: uppercase;
   letter-spacing: 0.16em;
   font-size: 0.62rem;
 }

 .stats-value {
   color: var(--text-soft);
   font-variant-numeric: tabular-nums;
 }

 .stats-divider {
   color: rgba(176,147,110,0.16);
   margin: 0 0.9rem;
 }

/* ── Filter Bar ── */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  min-height: 56px;
  padding-top: 0.75rem;
  padding-bottom: 0.75rem;
  border-bottom: none;
  background: transparent;
}

 .filter-label {
   flex-shrink: 0;
   font-size: 0.62rem;
   color: var(--text-dim);
   letter-spacing: 0.18em;
   text-transform: uppercase;
 }

 .filter-tags {
   display: flex;
   gap: 0.5rem;
   flex-wrap: wrap;
   align-items: center;
 }

 .filter-tag {
   padding: 0.38rem 0.9rem;
   border: 1px solid rgba(176,147,110,0.10);
   border-radius: 999px;
   font-size: 0.72rem;
   letter-spacing: 0.05em;
   cursor: pointer;
   background: rgba(255,255,255,0.01);
   color: var(--text-mid);
   transition: all 0.18s ease;
   font-family: inherit;
   white-space: nowrap;
 }

 .filter-tag:hover {
   border-color: rgba(176,147,110,0.28);
   color: var(--text-soft);
   background: rgba(177,140,99,0.05);
 }

 .filter-tag.active {
   border-color: rgba(176,147,110,0.32);
   color: var(--accent-light);
   background: rgba(177,140,99,0.08);
 }

 /* ── Main ── */
 .main {
   padding-top: 2.8rem;
   padding-bottom: 6rem;
 }

 /* ── Year Section ── */
 .year-section { margin-bottom: 3.5rem; }

 .year-header {
   display: flex;
   align-items: baseline;
   gap: 1rem;
   padding: 1.4rem 0 1rem;
   margin-bottom: 1.4rem;
   border-bottom: 1px solid rgba(176,147,110,0.10);
 }

 .year-num {
   font-size: 3rem;
   font-weight: 300;
   color: var(--accent);
   letter-spacing: 0.02em;
   line-height: 1;
   font-variant-numeric: tabular-nums;
 }

 .year-era {
   font-size: 0.75rem;
   color: var(--text-dim);
   letter-spacing: 0.18em;
 }

 .year-count {
   margin-left: auto;
   font-size: 0.68rem;
   color: var(--text-dim);
   letter-spacing: 0.06em;
 }

 /* ── Group Section ── */
 .group-section { margin-bottom: 3.5rem; }

 .group-header {
   display: flex;
   align-items: baseline;
   gap: 0.8rem;
   padding: 1.2rem 0 1rem;
   margin-bottom: 1.4rem;
   border-bottom: 1px solid rgba(176,147,110,0.10);
 }

 .group-name {
   font-size: 1rem;
   color: var(--accent);
   font-weight: 400;
   letter-spacing: 0.15em;
 }

 .group-count {
   font-size: 0.68rem;
   color: var(--text-dim);
   letter-spacing: 0.06em;
 }

 /* ── Cards Grid ── */
 .albums-grid {
   display: grid;
   grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
   gap: 1.5rem;
 }

 .album-card { cursor: pointer; }

 .cover-wrap {
   position: relative;
   aspect-ratio: 1;
   overflow: hidden;
   border-radius: 2px;
   background: var(--surface);
   transition: transform 0.35s cubic-bezier(0.23, 1, 0.32, 1),
               box-shadow 0.35s ease,
               border-color 0.35s ease;
   border: 1px solid rgba(176,147,110,0.06);
 }

 .album-card:hover .cover-wrap {
   transform: translateY(-3px);
   box-shadow: 0 8px 28px rgba(0,0,0,0.35), 0 0 0 1px rgba(176,147,110,0.14);
 }

 .cover-wrap img {
   width: 100%;
   height: 100%;
   object-fit: cover;
   display: block;
   transition: filter 0.35s ease, transform 0.45s cubic-bezier(0.23, 1, 0.32, 1);
   filter: grayscale(15%) brightness(0.88);
 }

 .album-card:hover .cover-wrap img {
   filter: grayscale(0%) brightness(0.96);
   transform: scale(1.03);
 }

 .cover-placeholder {
   width: 100%;
   height: 100%;
   display: flex;
   flex-direction: column;
   align-items: center;
   justify-content: center;
   background: var(--surface2);
   color: rgba(176,147,110,0.18);
   font-size: 0.62rem;
   letter-spacing: 0.1em;
   text-align: center;
   padding: 1rem;
 }

 .cover-placeholder .yr {
   font-size: 2.2rem;
   font-weight: 300;
   color: rgba(176,147,110,0.25);
   letter-spacing: 0.04em;
   display: block;
   line-height: 1;
   margin-bottom: 0.4rem;
 }

 /* ── Card Text ── */
 .card-text { padding: 0.65rem 0.1rem 0.25rem; }

 .card-name {
   font-size: 0.84rem;
   line-height: 1.45;
   color: var(--text);
   display: -webkit-box;
   -webkit-line-clamp: 2;
   -webkit-box-orient: vertical;
   overflow: hidden;
   margin-bottom: 0.28rem;
 }

 .card-meta {
   display: flex;
   align-items: center;
   gap: 0.4rem;
   flex-wrap: wrap;
 }

 .card-date {
   font-size: 0.68rem;
   color: var(--text-dim);
   font-variant-numeric: tabular-nums;
   letter-spacing: 0.03em;
 }

 .card-dot {
   width: 2px;
   height: 2px;
   border-radius: 50%;
   background: var(--text-dim);
   flex-shrink: 0;
 }

 .card-artist {
   font-size: 0.68rem;
   color: var(--text-dim);
   white-space: nowrap;
   overflow: hidden;
   text-overflow: ellipsis;
   max-width: 140px;
   letter-spacing: 0.03em;
 }

 /* ── Modal ── */
 .modal-overlay {
   position: fixed;
   inset: 0;
   background: rgba(0,0,0,0.86);
   z-index: 1000;
   display: flex;
   align-items: center;
   justify-content: center;
   opacity: 0;
   pointer-events: none;
   transition: opacity 0.28s ease;
   backdrop-filter: blur(8px);
   padding: 1rem;
 }

 .modal-overlay.open {
   opacity: 1;
   pointer-events: all;
 }

 .modal {
   position: relative;
   background: var(--surface2);
   border: 1px solid rgba(176,147,110,0.14);
   border-radius: 4px;
   max-width: 860px;
   width: 100%;
   height: 540px;
   overflow: hidden;
   display: grid;
   grid-template-columns: 520px 1fr;
   gap: 0;
   box-shadow: var(--shadow);
   transform: scale(0.97) translateY(8px);
   transition: transform 0.35s cubic-bezier(0.23, 1, 0.32, 1);
 }

 .modal-overlay.open .modal {
   transform: scale(1) translateY(0);
 }

 .modal-cover {
   width: 520px;
   height: 540px;
   overflow: hidden;
   background: var(--surface3);
   display: flex;
   align-items: center;
   justify-content: center;
   flex-shrink: 0;
 }

 .modal-cover img {
   width: 520px;
   height: 540px;
   object-fit: cover;
 }

 .modal-cover .cover-placeholder {
   width: 520px;
   height: 540px;
 }

 .modal-body {
   height: 540px;
   display: flex;
   flex-direction: column;
   padding: 1.8rem 1.4rem 1.4rem;
   overflow: hidden;
   position: relative;
 }

 .modal-close {
   position: absolute;
   top: 1.25rem;
   right: 1.25rem;
   width: 30px;
   height: 30px;
   background: rgba(0,0,0,0.5);
   border: 1px solid var(--border-strong);
   border-radius: 50%;
   color: var(--text-dim);
   cursor: pointer;
   display: flex;
   align-items: center;
   justify-content: center;
   font-size: 0.8rem;
   transition: all 0.15s ease;
   z-index: 5;
 }

 .modal-close:hover {
   color: var(--text);
   border-color: rgba(176,147,110,0.35);
   background: rgba(0,0,0,0.7);
 }

 .modal-name {
   font-size: 1.45rem;
   font-weight: 400;
   color: var(--accent-light);
   line-height: 1.3;
   margin-bottom: 0.6rem;
   flex-shrink: 0;
   padding-right: 2.5rem;
 }

 .modal-meta-line {
   font-size: 0.78rem;
   color: var(--text-mid);
   line-height: 1.6;
   padding-bottom: 0.8rem;
   margin-bottom: 0.8rem;
   border-bottom: 1px solid var(--border);
   display: flex;
   align-items: center;
   gap: 0.5rem;
   flex-wrap: wrap;
   flex-shrink: 0;
 }

 .modal-meta-sep {
   color: rgba(176,147,110,0.25);
 }

 .modal-submeta {
   font-size: 0.72rem;
   color: var(--text-dim);
   margin-top: 0.3rem;
   flex-shrink: 0;
 }

 .modal-desc {
   font-size: 0.82rem;
   color: var(--text-mid);
   line-height: 1.85;
   white-space: pre-wrap;
   flex: 1;
   overflow-y: auto;
 }

 /* ── Footer ── */
 .page-footer {
   padding-top: 2.5rem;
   padding-bottom: 2.5rem;
   border-top: 1px solid var(--border);
 }

 .footer-note {
   font-size: 0.72rem;
   color: var(--text-dim);
   line-height: 1.8;
   letter-spacing: 0.04em;
 }

 /* ── Back to top ── */
 .back-to-top {
   position: fixed;
   right: 1.5rem;
   bottom: 1.5rem;
   width: 40px;
   height: 40px;
   border-radius: 999px;
   border: 1px solid rgba(176,147,110,0.14);
   background: rgba(13,12,11,0.88);
   color: var(--text-dim);
   backdrop-filter: blur(12px);
   display: inline-flex;
   align-items: center;
   justify-content: center;
   cursor: pointer;
   box-shadow: var(--shadow-soft);
   opacity: 0;
   visibility: hidden;
   transform: translateY(6px);
   transition: opacity 0.22s ease, transform 0.22s ease, color 0.18s ease, border-color 0.18s ease;
   z-index: 80;
   font-size: 0.85rem;
 }

 .back-to-top.visible {
   opacity: 1;
   visibility: visible;
   transform: translateY(0);
 }

 .back-to-top:hover {
   color: var(--accent-light);
   border-color: rgba(176,147,110,0.28);
 }

 /* ── View panels ── */
 .view-panel { display: none; }
 .view-panel.active { display: block; }

 /* ── Responsive ── */
 @media (max-width: 900px) {
   header, .hero-shell, .stats-bar, .filter-bar, .main, .page-footer { padding-left: 1.2rem; padding-right: 1.2rem; }
   .modal {
     grid-template-columns: 1fr;
     height: auto;
     max-height: 95vh;
     overflow-y: auto;
   }
   .modal-cover { width: 100%; height: auto; aspect-ratio: 1; border-radius: 0; }
   .modal-cover img { width: 100%; height: auto; }
   .modal-cover .cover-placeholder { width: 100%; height: auto; aspect-ratio: 1; }
   .modal-body { height: auto; max-height: none; padding: 1.2rem; overflow: visible; }
   .modal-desc { overflow-y: visible; }
   .nav-tab { padding: 0.4rem 0.85rem; font-size: 0.75rem; }
   .filter-bar { top: auto; }
 }

 @media (max-width: 600px) {
   .albums-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
   .year-num { font-size: 2.2rem; }
   .hero-title { font-size: 1.8rem; }
 }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <a href="index.html" class="logo-home" aria-label="返回首页">←</a>
      <span class="logo-name">窦唯</span>
      <span class="logo-sub">专辑档案 · 1994—2026</span>
    </div>
    <nav class="nav-tabs">
      <button class="nav-tab active" data-view="year">按年份</button>
      <button class="nav-tab" data-view="group">按组合</button>
    </nav>
  </div>
</header>

<div class="hero-shell">
  <div class="hero">
    <h1 class="hero-title">窦唯 · 专辑档案</h1>
    <p class="hero-copy">按年份与组合索引的公开作品静态整理。</p>
    <p class="hero-note">不提供在线收听、下载或流媒体服务。</p>
  </div>
</div>

<div class="index-bar" id="index-bar">
  <div class="stats-bar" id="stats-bar">
    <span class="stats-item"><span class="stats-label">时间跨度</span><span class="stats-value">1994—2026</span></span>
    <span class="stats-divider">·</span>
    <span class="stats-item"><span class="stats-label">收录作品</span><span class="stats-value">221 张</span></span>
    <span class="stats-divider">·</span>
    <span class="stats-item"><span class="stats-label">编排方式</span><span class="stats-value">年份 / 组合双索引</span></span>
    <span class="stats-divider">·</span>
    <span class="stats-item"><span class="stats-label">介质类型</span><span class="stats-value">5 种</span></span>
  </div>
  <div class="filter-bar" id="filter-bar">
    <span class="filter-label">发行年份</span>
    <div class="filter-tags" id="filter-year-tags"></div>
  </div>
  <div class="filter-bar" id="filter-group-bar">
    <span class="filter-label">专辑艺术家</span>
    <div class="filter-tags" id="filter-group-tags"></div>
  </div>
</div>

<div class="main">
  <div class="view-panel active" id="panel-year"></div>
  <div class="view-panel" id="panel-group"></div>
</div>

<footer class="page-footer">
  <p class="footer-note">本页仅作公开资料整理与静态展示，不提供在线收听、下载或流媒体服务。</p>
</footer>

<!-- Back to top -->
<button class="back-to-top" id="back-to-top" type="button" aria-label="回到顶部">↑</button>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-cover" id="modal-cover"></div>
    <div class="modal-body">
      <button class="modal-close" id="modal-close">✕</button>
      <div class="modal-name" id="modal-name"></div>
      <div class="modal-meta-line" id="modal-meta"></div>
      <div class="modal-desc" id="modal-desc"></div>
    </div>
  </div>
</div>

<script src="albums.js" defer></script>
</body>
</html>
