<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>窦唯 · 专辑集</title>
<style>
  :root {
    --bg: #090909;
    --surface: #111;
    --surface2: #181818;
    --border: #242424;
    --text: #e0ddd8;
    --text-dim: #5a5a5a;
    --text-mid: #888;
    --accent: #b8956a;
    --accent-light: #d4b48a;
    --accent-dark: #7a6040;
    --tag-bg: #1c1c1c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif SC', 'Source Han Serif SC', 'STSong', serif;
    min-height: 100vh;
    line-height: 1.6;
  }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(9,9,9,0.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 3rem;
  }

  .header-inner {
    max-width: 1440px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    gap: 2rem;
  }

  .logo {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .logo-name {
    font-size: 1.5rem;
    font-weight: 400;
    color: var(--accent);
    letter-spacing: 0.25em;
  }

  .logo-sub {
    font-size: 0.68rem;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    margin-top: -2px;
  }

  .nav-tabs {
    display: flex;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 5px;
    overflow: hidden;
  }

  .nav-tab {
    padding: 0.45rem 1.2rem;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    background: transparent;
    color: var(--text-dim);
    border: none;
    cursor: pointer;
    transition: all 0.18s;
    font-family: inherit;
    white-space: nowrap;
  }

  .nav-tab:not(:last-child) { border-right: 1px solid var(--border); }

  .nav-tab.active {
    background: var(--accent);
    color: #000;
    font-weight: 600;
  }

  .nav-tab:hover:not(.active) {
    color: var(--text);
    background: var(--surface2);
  }

  .filter-bar {
    max-width: 1440px;
    margin: 0 auto;
    padding: 1.2rem 3rem;
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }

  .filter-tag {
    padding: 0.28rem 0.85rem;
    border: 1px solid var(--border);
    border-radius: 16px;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    background: transparent;
    color: var(--text-dim);
    transition: all 0.15s;
    font-family: inherit;
    white-space: nowrap;
  }

  .filter-tag:hover, .filter-tag.active {
    border-color: var(--accent-dark);
    color: var(--accent);
    background: rgba(184,149,106,0.07);
  }

  .main {
    max-width: 1440px;
    margin: 0 auto;
    padding: 2rem 3rem 6rem;
  }

  .year-section { margin-bottom: 3rem; }

  .year-header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    padding: 1.2rem 0 0.8rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.2rem;
  }

  .year-num {
    font-size: 2.4rem;
    font-weight: 300;
    color: var(--accent);
    letter-spacing: 0.02em;
    line-height: 1;
  }

  .year-era {
    font-size: 0.78rem;
    color: var(--text-dim);
    letter-spacing: 0.12em;
  }

  .year-count {
    margin-left: auto;
    font-size: 0.7rem;
    color: var(--text-dim);
  }

  .albums-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 1.4rem;
  }

  .group-section { margin-bottom: 3rem; }

  .group-header {
    font-size: 1.05rem;
    color: var(--accent);
    font-weight: 400;
    letter-spacing: 0.15em;
    padding: 1.2rem 0 0.7rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.2rem;
    display: flex;
    align-items: baseline;
    gap: 0.8rem;
  }

  .group-count {
    font-size: 0.7rem;
    color: var(--text-dim);
    font-weight: 400;
    letter-spacing: 0.05em;
  }

  .album-card { cursor: pointer; }

  .cover-wrap {
    position: relative;
    aspect-ratio: 1;
    overflow: hidden;
    border-radius: 2px;
    background: var(--surface);
    transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
  }

  .album-card:hover .cover-wrap { transform: translateY(-3px); }

  .cover-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: filter 0.3s, transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
    filter: grayscale(20%) brightness(0.92);
  }

  .album-card:hover .cover-wrap img {
    filter: grayscale(0%) brightness(1);
    transform: scale(1.04);
  }

  .cover-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--surface2);
    color: var(--border);
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-align: center;
    padding: 1rem;
  }

  .cover-placeholder .yr {
    font-size: 2rem;
    font-weight: 300;
    color: var(--border);
    letter-spacing: 0.05em;
    display: block;
  }

  .card-text { padding: 0.6rem 0.1rem 0.2rem; }

  .card-name {
    font-size: 0.85rem;
    line-height: 1.4;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 0.2rem;
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    flex-wrap: wrap;
  }

  .card-year {
    font-size: 0.7rem;
    color: var(--accent-dark);
    font-variant-numeric: tabular-nums;
  }

  .card-dot {
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
  }

  .card-artist {
    font-size: 0.7rem;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 140px;
  }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    backdrop-filter: blur(6px);
    padding: 1rem;
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    max-width: 820px;
    width: 100%;
    max-height: 90vh;
    overflow: hidden;
    display: grid;
    grid-template-columns: 500px 1fr;
    transform: scale(0.96) translateY(10px);
    transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
  }

  .modal-overlay.open .modal { transform: scale(1) translateY(0); }

  .modal-cover {
    width: 500px;
    height: 500px;
    overflow: hidden;
    border-radius: 6px 0 0 6px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    flex-shrink: 0;
  }

  .modal-cover img {
    width: 500px;
    height: 500px;
    object-fit: cover;
  }

  .modal-cover .cover-placeholder {
    width: 500px;
    height: 500px;
    border-radius: 0;
  }

  .modal-body {
    padding: 2rem 1.8rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    overflow-y: auto;
    max-height: 90vh;
  }

  .modal-name {
    font-size: 1.4rem;
    font-weight: 400;
    color: var(--accent);
    line-height: 1.35;
    margin-bottom: 0.3rem;
  }

  .modal-meta {
    font-size: 0.78rem;
    color: var(--text-dim);
    display: flex;
    gap: 0.8rem;
    flex-wrap: wrap;
    padding-bottom: 0.8rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0.5rem;
  }

  .modal-desc {
    font-size: 0.82rem;
    color: var(--text-mid);
    line-height: 1.8;
    white-space: pre-wrap;
    flex: 1;
  }

  .modal-close {
    position: absolute;
    top: 0.75rem;
    right: 0.75rem;
    width: 30px;
    height: 30px;
    background: rgba(0,0,0,0.6);
    border: 1px solid var(--border);
    border-radius: 50%;
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    transition: all 0.15s;
    z-index: 5;
  }

  .modal-close:hover {
    color: var(--text);
    background: rgba(0,0,0,0.8);
  }

  .view-panel { display: none; }
  .view-panel.active { display: block; }

  @media (max-width: 900px) {
    header, .filter-bar, .main { padding-left: 1.2rem; padding-right: 1.2rem; }
    .modal { grid-template-columns: 1fr; max-height: 95vh; overflow-y: auto; }
    .modal-cover { width: 100%; height: auto; aspect-ratio: 1; border-radius: 6px 6px 0 0; max-height: 50vh; }
    .modal-cover img { width: 100%; height: 100%; }
    .modal-cover .cover-placeholder { width: 100%; height: auto; aspect-ratio: 1; }
    .modal-body { padding: 1.2rem; max-height: none; }
    .nav-tab { padding: 0.4rem 0.8rem; font-size: 0.75rem; }
  }

  @media (max-width: 600px) {
    .albums-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
    .year-num { font-size: 1.8rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <span class="logo-name">窦唯</span>
      <span class="logo-sub">专辑集 · 1994 – 2026</span>
    </div>
    <nav class="nav-tabs">
      <button class="nav-tab active" data-view="year">按年份</button>
      <button class="nav-tab" data-view="group">按组合</button>
    </nav>
  </div>
</header>

<div class="filter-bar" id="filter-bar"></div>

<div class="main">
  <div class="view-panel active" id="panel-year"></div>
  <div class="view-panel" id="panel-group"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-cover" id="modal-cover"></div>
    <div class="modal-body">
      <div class="modal-name" id="modal-name"></div>
      <div class="modal-meta" id="modal-meta"></div>
      <div class="modal-desc" id="modal-desc"></div>
    </div>
  </div>
  <button class="modal-close" id="modal-close">✕</button>
</div>

<script>
let albums = [];

async function init() {
  const resp = await fetch('albums.json');
  albums = await resp.json();
  renderFilters();
  renderYearView();
  renderGroupView();
}

const ERAS = {
  1994:'黑梦', 1995:'黑梦', 1996:'黑梦', 1997:'黑梦', 1998:'黑梦', 1999:'黑梦',
  2000:'影视 OST', 2001:'影视 OST',
  2002:'暮良文王', 2003:'暮良文王',
  2004:'暮良文王 · 不一定',
  2005:'暮良文王 · 不一定', 2006:'不一定 · 不一样',
  2007:'不一定 · 不一样', 2008:'不一定 · 不一样',
  2009:'不一定',
  2010:'不一样', 2011:'不一定', 2012:'不一样',
  2013:'不一定', 2014:'不一样 · 天宫图',
  2015:'不一样 · 天真君公',
  2016:'不一样', 2017:'不一样', 2018:'不一定',
  2019:'不一定 · 朝简',
  2020:'不一定 · 朝简',
  2021:'不一定 · 朝简',
  2022:'不一定 · 朝简',
  2023:'不一定 · 朝简',
  2024:'不一定 · 朝简',
  2025:'不一定 · 朝简',
  2026:'不一定 · 朝简',
};

function eraLabel(y) { return ERAS[y] || ''; }

function groupOf(a) {
  const art = a.album_artist || '';
  if (art === '窦唯') return '窦唯';
  if (art.includes('暮良文王')) return '暮良文王';
  if (art.includes('不一定') && !art.includes('不一样')) return '不一定';
  if (art.includes('不一样')) return '不一样';
  if (art.includes('朝简')) return '朝简';
  if (art.includes('译乐队') || art === '译乐队') return '译乐队';
  if (art.includes('东游记')) return '东游记';
  if (art.includes('FM3')) return 'FM3';
  if (art.includes('天宫图')) return '天宫图';
  return null;
}

function coverHTML(album) {
  if (album.cover) {
    return `<img src="covers/${album.cover}" alt="${album.name}"
             onerror="this.parentElement.innerHTML=placeholderHTML(${album.year||0},'${album.name}');">`;
  }
  return placeholderHTML(album.year || 0, album.name);
}

function placeholderHTML(year, name) {
  return `<div class="cover-placeholder">
    <span class="yr">${year || ''}</span>
    ${name ? '<span style="margin-top:0.4rem;font-size:0.6rem;letter-spacing:0.08em">' + name.slice(0,4) + '</span>' : ''}
  </div>`;
}

function cardHTML(album) {
  const artists = (album.album_artist || album.artist || '').split(/[;；]/).map(a => a.trim());
  const dateStr = album.date || '';
  return `
  <div class="album-card" onclick='openModal({name:${JSON.stringify(album.name)},artist:${JSON.stringify(album.artist)},album_artist:${JSON.stringify(album.album_artist)},date:${JSON.stringify(album.date)},year:${album.year},medium:${JSON.stringify(album.medium)},description:${JSON.stringify(album.description||'')},cover:${JSON.stringify(album.cover)}})'>
    <div class="cover-wrap">
      ${coverHTML(album)}
    </div>
    <div class="card-text">
      <div class="card-name">${album.name}</div>
      <div class="card-meta">
        <span class="card-year">${dateStr}</span>
        ${artists.length > 1 ? `<span class="card-dot"></span><span class="card-artist">${album.album_artist}</span>` : ''}
      </div>
    </div>
  </div>`;
}

function sortByDate(arr) {
  return [...arr].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
}

function renderYearView(filterYear) {
  const filtered = filterYear && filterYear !== 'all'
    ? albums.filter(a => String(a.year) === String(filterYear))
    : albums;

  const sorted = sortByDate(filtered);

  const byYear = {};
  for (const a of sorted) {
    const y = a.year || 0;
    if (!byYear[y]) byYear[y] = [];
    byYear[y].push(a);
  }

  const years = Object.keys(byYear).sort((a, b) => b - a);
  let html = '';

  for (const y of years) {
    const era = eraLabel(parseInt(y));
    html += `
    <div class="year-section">
      <div class="year-header">
        <span class="year-num">${y}</span>
        ${era ? `<span class="year-era">${era}</span>` : ''}
        <span class="year-count">${byYear[y].length} 张</span>
      </div>
      <div class="albums-grid">
        ${byYear[y].map(a => cardHTML(a)).join('')}
      </div>
    </div>`;
  }

  document.getElementById('panel-year').innerHTML = html || '<p style="color:var(--text-dim);padding:2rem">无结果</p>';
}

function renderGroupView(filterYear) {
  const filtered = filterYear && filterYear !== 'all'
    ? albums.filter(a => String(a.year) === String(filterYear))
    : albums;

  const sorted = sortByDate(filtered);

  const groupOrder = ['窦唯','暮良文王','不一定','不一样','朝简','译乐队','东游记','FM3','天宫图'];
  const byGroup = {};
  for (const g of groupOrder) byGroup[g] = [];

  let others = [];
  for (const a of sorted) {
    const g = groupOf(a);
    if (g && byGroup.hasOwnProperty(g)) {
      byGroup[g].push(a);
    } else if (g) {
      byGroup[g] = [a];
    } else {
      others.push(a);
    }
  }

  let html = '';
  for (const g of groupOrder) {
    if (!byGroup[g].length) continue;
    html += `
    <div class="group-section">
      <div class="group-header">
        ${g}
        <span class="group-count">${byGroup[g].length} 张</span>
      </div>
      <div class="albums-grid">
        ${byGroup[g].map(a => cardHTML(a)).join('')}
      </div>
    </div>`;
  }

  const unmatchedGroups = {};
  for (const a of others) {
    const g = a.album_artist || '未知';
    if (!unmatchedGroups[g]) unmatchedGroups[g] = [];
    unmatchedGroups[g].push(a);
  }
  for (const [g, gas] of Object.entries(unmatchedGroups)) {
    if (groupOrder.includes(g)) continue;
    html += `
    <div class="group-section">
      <div class="group-header">${g} <span class="group-count">${gas.length} 张</span></div>
      <div class="albums-grid">
        ${gas.map(a => cardHTML(a)).join('')}
      </div>
    </div>`;
  }

  document.getElementById('panel-group').innerHTML = html || '<p style="color:var(--text-dim);padding:2rem">无结果</p>';
}

function renderFilters() {
  const years = [...new Set(albums.map(a => a.year).filter(Boolean))].sort((a,b) => b - a);
  const bar = document.getElementById('filter-bar');
  let html = `<button class="filter-tag active" data-year="all">全部</button>`;
  for (const y of years) {
    html += `<button class="filter-tag" data-year="${y}">${y}</button>`;
  }
  bar.innerHTML = html;

  bar.querySelectorAll('.filter-tag').forEach(btn => {
    btn.addEventListener('click', () => {
      const year = btn.dataset.year;
      document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      if (currentView === 'year') renderYearView(year);
      else renderGroupView(year);
    });
  });
}

function openModal(album) {
  if (!album) return;

  const coverEl = document.getElementById('modal-cover');
  if (album.cover) {
    coverEl.innerHTML = `<img src="covers/${album.cover}" alt="${album.name}">`;
  } else {
    coverEl.innerHTML = placeholderHTML(album.year || 0, album.name);
  }

  document.getElementById('modal-name').textContent = album.name;
  document.getElementById('modal-meta').innerHTML =
    `<span>${album.year || '—'}</span>` +
    (album.date ? `<span>·</span><span>${album.date}</span>` : '') +
    (album.album_artist ? `<span>·</span><span>${album.album_artist}</span>` : '') +
    (album.medium ? `<span>·</span><span>${album.medium}</span>` : '');

  const desc = (album.description || '').trim();
  document.getElementById('modal-desc').textContent = desc || '（暂无介绍）';

  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

let currentView = 'year';
document.querySelectorAll('.nav-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    currentView = tab.dataset.view;
    document.getElementById(`panel-${currentView}`).classList.add('active');
    const activeYear = document.querySelector('.filter-tag.active')?.dataset.year || 'all';
    if (currentView === 'year') renderYearView(activeYear);
    else renderGroupView(activeYear);
  });
});

window.albums = albums;
init();
</script>
</body>
</html>
