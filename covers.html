<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>封面墙 · 窦唯作品档案馆</title>
<style>
:root {
  --bg: #0a0a0a;
  --surface: #111111;
  --border: rgba(176,147,110,0.10);
  --border-strong: rgba(176,147,110,0.22);
  --text: #e3ddd4;
  --text-soft: #c4b8a8;
  --text-mid: #97897b;
  --text-dim: #6c6258;
  --accent: #b08c63;
  --accent-light: #d0b089;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
  line-height: 1.6;
}
a { color: inherit; text-decoration: none; }

/* ── Header ── */
header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(10,10,10,0.82);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 1600px;
  margin: 0 auto;
  padding: 0.9rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo-name { font-size: 1.05rem; letter-spacing: 0.3em; color: var(--text); }
.logo-sub { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 0.12em; margin-left: 0.9rem; }
.header-right { display: flex; align-items: center; gap: 1.2rem; }
.header-count { font-size: 0.72rem; color: var(--text-dim); letter-spacing: 0.1em; font-variant-numeric: tabular-nums; }
.back-link { font-size: 0.72rem; color: var(--text-mid); letter-spacing: 0.15em; transition: color 0.2s ease; }
.back-link:hover { color: var(--accent-light); }

/* ── Cover Wall ── */
.wall-intro {
  max-width: 1600px;
  margin: 0 auto;
  padding: 1.4rem 2rem 0.4rem;
}
.wall-intro p { font-size: 0.78rem; color: var(--text-dim); letter-spacing: 0.08em; }
.cover-wall {
  max-width: 1600px;
  margin: 0 auto;
  padding: 1.2rem 1.2rem 3rem;
  columns: 12;
  column-gap: 4px;
}
.wall-item {
  position: relative;
  break-inside: avoid;
  margin-bottom: 4px;
  cursor: pointer;
  overflow: hidden;
  background: var(--surface);
}
.wall-item img {
  width: 100%;
  display: block;
  aspect-ratio: 1;
  object-fit: cover;
  transition: filter 0.25s ease;
}
.wall-item:hover img { filter: brightness(1.12); }
.wall-cap {
  position: absolute;
  inset: 0;
  background: rgba(8,8,8,0.62);
  opacity: 0;
  transition: opacity 0.2s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.2rem;
  padding: 0.4rem;
  text-align: center;
}
.wall-item:hover .wall-cap { opacity: 1; }
.wall-name { font-size: 0.72rem; color: var(--text-soft); letter-spacing: 0.05em; }
.wall-year { font-size: 0.62rem; color: var(--text-dim); font-variant-numeric: tabular-nums; letter-spacing: 0.1em; }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.82);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}
.modal-overlay.open { display: flex; }
.modal {
  max-width: 860px;
  width: 100%;
  max-height: 88vh;
  overflow-y: auto;
  background: #101010;
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  display: grid;
  grid-template-columns: 300px 1fr;
}
.modal-cover { width: 300px; height: 300px; }
.modal-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.modal-body { position: relative; padding: 1.8rem 1.8rem 1.4rem; }
.modal-close {
  position: absolute; top: 0.8rem; right: 1rem;
  background: none; border: none;
  color: var(--text-dim); font-size: 1.05rem;
  cursor: pointer; font-family: inherit;
}
.modal-close:hover { color: var(--text-soft); }
.modal-name { font-size: 1.5rem; color: var(--text); letter-spacing: 0.06em; padding-right: 1.5rem; }
.modal-meta-line { margin-top: 0.5rem; font-size: 0.8rem; color: var(--text-mid); }
.modal-meta-sep { margin: 0 0.45rem; color: var(--text-dim); }
.modal-submeta { margin-top: 0.2rem; font-size: 0.72rem; color: var(--text-dim); }
.modal-desc {
  margin-top: 1.2rem;
  font-size: 0.8rem;
  color: var(--text-mid);
  line-height: 1.9;
  white-space: pre-line;
  border-top: 1px solid var(--border);
  padding-top: 1rem;
}

/* ── Responsive ── */
@media (max-width: 1400px) { .cover-wall { columns: 10; } }
@media (max-width: 1000px) { .cover-wall { columns: 6; } }
@media (max-width: 640px) {
  .cover-wall { columns: 4; padding: 1rem 0.5rem 2rem; }
  .modal { grid-template-columns: 1fr; }
  .modal-cover { width: 100%; height: auto; aspect-ratio: 1; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <a href="index.html" class="back-link" aria-label="返回首页">←</a>
      <span class="logo-name">窦唯</span>
      <span class="logo-sub">封面墙 · COVER WALL</span>
    </div>
    <div class="header-right">
      <span class="header-count" id="wall-count">… 张封面</span>
      <a href="albums.html" class="back-link">专辑档案 →</a>
    </div>
  </div>
</header>

<div class="wall-intro">
  <p>一面唱片墙。按发行时间铺开，鼠标悬停看名字，点击进详情。</p>
</div>

<div class="cover-wall" id="cover-wall"></div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-cover" id="modal-cover"></div>
    <div class="modal-body">
      <button class="modal-close" id="modal-close" aria-label="关闭">✕</button>
      <div class="modal-name" id="modal-name"></div>
      <div class="modal-meta-line" id="modal-meta"></div>
      <div class="modal-desc" id="modal-desc"></div>
    </div>
  </div>
</div>

<script src="covers.js" defer></script>
</body>
</html>
